<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drag-and-Drop Linear Regression</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>Linear Regression Studio</h1>
      <p class="subtitle">Drag & drop a CSV, pick columns, and fit a model in your browser.</p>
    </header>

    <section class="file-section">
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="CSV dropzone (click to select)">
        <div class="dropzone__content">
          <div class="dropzone__icon">📄</div>
          <div>
            <div class="dropzone__title">Drop CSV here</div>
            <div class="dropzone__subtitle">or click to select a file</div>
          </div>
        </div>
        <input id="fileInput" type="file" accept=".csv" hidden />
      </div>
      <div id="fileInfo" class="file-info hidden"></div>
    </section>

    <section class="columns-section">
      <div class="columns__container">
        <div class="columns__panel">
          <h3>Available numeric columns</h3>
          <div id="availableColumns" class="chips chips--pool" aria-label="Available columns"></div>
        </div>
        <div class="columns__panel">
          <h3>Features (X)</h3>
          <div id="featuresZone" class="dropzone--columns" aria-label="Features dropzone"></div>
        </div>
        <div class="columns__panel">
          <h3>Target (y)</h3>
          <div id="targetZone" class="dropzone--columns" aria-label="Target dropzone"></div>
        </div>
      </div>
      <div class="columns__actions">
        <label class="alpha">
          <span>Ridge α:</span>
          <input id="alphaRange" type="range" min="0" max="10" step="0.01" value="0" />
          <span id="alphaValue" class="alpha__value">0.00</span>
        </label>
        <button id="resetBtn" class="btn btn--ghost" type="button">Reset selections</button>
        <button id="trainBtn" class="btn" type="button" disabled>Train model</button>
      </div>
    </section>

    <section class="results-section">
      <div class="results__grid">
        <div class="panel">
          <h3>Metrics</h3>
          <div id="metrics" class="metrics"></div>
        </div>
        <div class="panel">
          <h3>Coefficients</h3>
          <div id="coefficients" class="coefficients"></div>
        </div>
      </div>
    </section>

    <section class="chart-section">
      <div class="panel">
        <h3>Predicted vs Actual</h3>
        <canvas id="scatterChart" height="260"></canvas>
      </div>
    </section>

    <section class="preview-section">
      <div class="panel">
        <h3>Data preview</h3>
        <div id="preview" class="preview"></div>
      </div>
    </section>

    <footer class="app__footer">
      <span>Runs fully in-browser. No data leaves your machine.</span>
    </footer>
  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.0/lib/browser/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- App -->
  <script src="main.js" defer></script>
</body>
</html>
